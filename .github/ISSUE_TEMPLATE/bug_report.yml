name: Bug report
description: Report a problem with Backpack Keybinds.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Include the versions from the instance where the problem happens.
        Reports and attachments are public; remove private details from logs before sharing.
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.20.1"
        - "1.21.1"
        - "1.21.4"
        - "1.21.8"
        - "1.21.11"
        - "26.1.2"
        - "Other (include it in Additional information)"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Backpack Keybinds version
      placeholder: "For example: 1.1.5"
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: Mod loader and version
      description: Enter your NeoForge version, or Forge version if using Forge on Minecraft 1.20.1.
      placeholder: "For example: NeoForge 21.1.264"
    validations:
      required: true
  - type: input
    id: backpacks-version
    attributes:
      label: Sophisticated Backpacks version
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: Sophisticated Core version
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - "Singleplayer"
        - "Multiplayer server"
        - "World opened to LAN"
    validations:
      required: true
  - type: dropdown
    id: server-addon
    attributes:
      label: Is Backpack Keybinds installed on the server?
      options:
        - "Singleplayer / not applicable"
        - "Yes"
        - "No"
        - "I do not know"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the relevant bindings, settings, upgrades, and whether the backpack is carried, nested, or placed.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash reports, or screenshots
      description: Optional but helpful. Attach latest.log or a crash report, paste a log link, or drag screenshots into this field.
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Relevant other mods, modpack name/version, or anything else that may help.
