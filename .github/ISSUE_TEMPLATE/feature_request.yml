name: Feature request
description: Suggest an improvement for Backpack Keybinds.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search existing requests first. Explain what you want to do and how the change would help.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the problem or situation you run into.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: Describe how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional. Include workarounds, screenshots, or examples that explain the idea.
